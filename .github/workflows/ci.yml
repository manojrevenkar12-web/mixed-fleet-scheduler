name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the held-out check reads the lock's history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check . && ruff format --check .
      - name: types
        run: mypy src tests
      - name: tests
        run: pytest -q
      - name: reports are generated, not edited
        if: matrix.python == '3.13'
        run: |
          python -m mfs.cli report
          git diff --exit-code -- REPORT.md README.md web/public/data/report.json
      - name: the committed development report passes its gates
        run: python -m mfs.cli gate dev
      - name: the held-out run happened once
        run: |
          if [ -f reports/heldout.lock ]; then
            n=$(git log --format=%H --no-renames -- reports/heldout.lock | wc -l)
            echo "heldout.lock commits: $n"; test "$n" -eq 1
            python -m mfs.cli run heldout && exit 1 || test $? -eq 3
          fi
      - name: the development study reruns and still passes
        if: matrix.python == '3.13'
        run: |
          python -m mfs.cli run dev --workers 2
          python -m mfs.cli gate dev
      - name: the service answers over HTTP
        run: python examples/drive_service.py

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: image builds
        run: docker build -t mixed-fleet-scheduler:ci .
      - name: container answers its health check
        run: |
          docker run -d --name mfs -p 8080:8080 mixed-fleet-scheduler:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs mfs; exit 1
